# Clear preset — tuned by a Sober user for a sharp, neutral image.
#
# Shader chain: Deband -> Bloom -> CAS -> Clarity -> Curves -> Vibrance.
# Parameters use the exact case-sensitive names declared in each .fx file;
# vkBasalt silently ignores any parameter whose name doesn't match.
#
# Paths assume username "jonathon" and Sober's Flatpak sandbox. If your
# username differs, replace /var/home/jonathon/ with /var/home/<you>/.
# The GUI's preset loader rewrites these paths on load, so the hardcoded
# user only matters for manual use.

effects = dbd:blm:cas:clr:crv:vib

dbd = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders/Deband.fx
Range = 128.0
Iterations = 1.0
custom_avgdiff = 255.0
custom_maxdiff = 10.0
custom_middiff = 255.0

blm = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders/Bloom.fx
fBloomThreshold = 0.829
fBloomAmount = 0.3
fBloomSaturation = 0.17
fLensdirtIntensity = 0.40
fLensdirtSaturation = 2.00
fAnamFlareThreshold = 0.900
fAnamFlareWideness = 2.40
fAnamFlareAmount = 14.5
fAnamFlareCurve = 1.20
fLenzIntensity = 1.00
fLenzThreshold = 0.800
fChapFlareTreshold = 0.900
iChapFlareCount = 15
fChapFlareDispersal = 0.250
fChapFlareSize = 0.450
fChapFlareCA = -0.50
fChapFlareIntensity = 100
fGodrayDecay = 0.990
fGodrayExposure = 1.000
fGodrayWeight = 1.250
fGodrayThreshold = 0.900
fFlareLuminance = 0.10
fFlareBlur = 200
fFlareIntensity = 2.07

casSharpness = 1.0

clr = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders/Clarity.fx
ClarityRadius = 3
ClarityOffset = 2.0
ClarityBlendIfDark = 200
ClarityBlendIfLight = 200
ClarityStrength = 0.40
ClarityDarkIntensity = 0

crv = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders/Curves.fx
Contrast = 1.00

vib = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders/Vibrance.fx
Vibrance = 1.00
VibranceRGBBalance = float3(1.0, 1.0, 1.0)

reshadeTexturePath = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Textures
reshadeIncludePath = /var/home/jonathon/.var/app/org.vinegarhq.Sober/config/vkBasalt/Shaders
depthCapture = off
enableOnLaunch = True
